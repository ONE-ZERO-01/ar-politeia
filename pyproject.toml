[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearcher-foundation"
version = "0.4.0"
description = "Multi-agent research orchestration with reproducibility gates"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
autoresearcher-graph = "autoresearcher.orchestration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["autoresearcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
