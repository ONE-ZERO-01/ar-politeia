# servers.toml — 项目-服务器路径映射
#
# 本文件是所有 Agent 获知「项目在哪台机器、哪个目录」的单一真相源。
# 基础信息由此手工维护；GPU 型号、Python 环境、数据路径等细节由 Agent
# 在对应服务器上自行探索（`nvidia-smi`、`which python`、`conda env list` 等）。
#
# 远程拓扑（详见 docs/server-config.md）：
#   本地 ──ssh zeus──▶ 网关（可外网，下载数据 / pip / git）
#              └──ssh umi-wanwb──▶ GPU 节点（4×A100）
#   zeus 与 umi-wanwb 共享同一文件系统，项目路径相同。
#
# 规则：一个项目可以有多个服务器路径，每个服务器只需在 [servers] 中定义一次。

# ============================================================================
# 服务器清单
# ============================================================================

[servers.local]
host = "localhost"
description = "本地 MacBook"

[servers.zeus]
host = "zeus"                              # SSH alias（~/.ssh/config）
description = "跳板/网关，可连外网；用于下载数据、git clone、pip/conda 安装"

[servers.umi-wanwb]
host = "umi-wanwb"                         # SSH alias；经 zeus ProxyJump
description = "A100 GPU 节点（4×A100-PCIE-40GB）；运行编译与仿真实验"

# H100（ssh h100 / ZTS）已于 2026-06 停用，不再维护。

# ============================================================================
# 项目-路径映射
# ============================================================================

[projects.politeia-ds]
name = "Politeia 政治仿真"
default_server = "local"                   # Cursor 工作区在本地；远程实验见 zeus / umi-wanwb

[projects.politeia-ds.paths]
local = "/Users/ruo/Library/CloudStorage/OneDrive-个人(2)/oneresearch/Politeia-ds"
zeus = "/home/wanwb/ONE/Politeia-ds"       # 与 umi-wanwb 共享（NFS）
umi-wanwb = "/home/wanwb/ONE/Politeia-ds"

# ============================================================================
# 模板：添加新项目
# ============================================================================
