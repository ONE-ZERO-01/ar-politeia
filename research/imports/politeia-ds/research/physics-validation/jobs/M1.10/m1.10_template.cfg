initial_particles = 20000
total_steps = 10000
dt = 0.01
output_interval = 500
compact_interval = 100
network_window_factor = 5

temperature = 0.3
friction = 1.0

social_strength = 3.0
social_distance = 1.0
interaction_range = 3.0

terrain_type = continent
terrain_scale = 0.5

carrying_capacity_base = 20.0
density_radius = 5.0
max_fertility = 5e-4
nursing_time = 1.5

exchange_rate = 0.003
ability_saturation_w = 5.0
wealth_decay_rate = 0.02
attachment_threshold = 0.05

tax_rate = 0.05
tax_efficiency = 0.5
loyalty_protection_gain = 0.03
loyalty_tax_drain = 0.1

assimilation_rate = 0.005
hierarchy_assimilation_rate = 0.3
conquest_base_prob = 0.02

# 以下模块开关将在各消融中独立设置
# loyalty_enabled
# conquest_enabled
# culture_enabled

technology_enabled = true
plague_enabled = true
reproduction_enabled = true
carrying_capacity_enabled = true
gender_enabled = true
age_pyramid = true
culture_dim = 4

max_hierarchy_depth = 10
hierarchy_repair_interval = 500
