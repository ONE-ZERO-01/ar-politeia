# M1.8: 涨落-耗散定理验证 — T×γ 参数扫描
# T=0.1,0.5,1.0,2.0 × γ=0.1,0.5,1.0,2.0 (16 combos)
# 1000 particles, 5000 steps, 1 min/run
#
# Expected: KE/N ≈ kB*T (equipartition), independent of γ
#           velocity distribution ~ Maxwell-Boltzmann
#           velocity autocorrelation decays as exp(-γ*t)
#
# Run template — batch script will iterate over (T,γ) pairs:
#   T=0.1 0.5 1.0 2.0
#   friction=0.1 0.5 1.0 2.0

initial_particles = 1000
total_steps = 5000
dt = 0.01
output_interval = 500
compact_interval = 100
domain_xmin = 0.0
domain_xmax = 100.0
domain_ymin = 0.0
domain_ymax = 100.0
random_seed = 42

temperature = T_PLACEHOLDER
friction = GAMMA_PLACEHOLDER

social_strength = 0.0
social_distance = 1.0
interaction_range = 2.5

terrain_type = flat

consumption_rate = 0.0
wealth_decay_rate = 0.0
survival_threshold = -1e9
accident_rate = 0.0
max_age = 1e9
max_fertility = 0.0
gompertz_alpha = 0.0
gompertz_beta = 0.0

culture_enabled = false
technology_enabled = false
loyalty_enabled = false
conquest_enabled = false
plague_enabled = false
reproduction_enabled = false
carrying_capacity_enabled = false

output_dir = OUTPUT_PLACEHOLDER
